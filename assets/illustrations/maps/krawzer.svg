  <rect x="9" y="9" width="782" height="582" rx="8" fill="none" stroke="#9a7848" stroke-width="1"/>
  <circle cx="18" cy="18" r="7" fill="#7a5a30" fill-opacity="0.5"/>
  <circle cx="782" cy="18" r="7" fill="#7a5a30" fill-opacity="0.5"/>
  <circle cx="18" cy="582" r="7" fill="#7a5a30" fill-opacity="0.5"/>
  <circle cx="782" cy="582" r="7" fill="#7a5a30" fill-opacity="0.5"/>

