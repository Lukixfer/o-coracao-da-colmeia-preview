<!-- Coral — Maga da Água, País da Água -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <radialGradient id="bg_coral" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </radialGradient>
    <radialGradient id="aura_agua" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#60b0e0" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2080c0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2080c0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle_coral">
      <circle cx="100" cy="105" r="78"/>
    </clipPath>
    <filter id="glow_agua">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="200" height="260" fill="url(#bg_coral)" rx="8"/>
  <!-- Moldura circular -->
  <circle cx="100" cy="105" r="80" fill="#0a1530" stroke="#4db8e8" stroke-width="2"/>
  <!-- Aura de Água -->
  <circle cx="100" cy="105" r="78" fill="url(#aura_agua)"/>

  <!-- Silhueta: torso -->
  <ellipse cx="100" cy="172" rx="40" ry="26" fill="#0a1220" clip-path="url(#circle_coral)"/>
  <!-- Pescoço -->
  <rect x="94" y="143" width="12" height="20" rx="4" fill="#d4a574"/>
  <!-- Rosto (oval, mais delicado) -->
  <ellipse cx="100" cy="106" rx="28" ry="34" fill="#d4a574"/>
  <!-- Cabelo (azul-escuro, longo, ondulado) -->
  <path d="M 72,102 Q 70,72 100,66 Q 130,72 128,102 Q 124,78 100,74 Q 76,78 72,102Z"
        fill="#1a3a5c"/>
  <path d="M 72,102 Q 68,115 65,135 Q 63,150 68,160" stroke="#1a3a5c" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 128,102 Q 132,115 135,135 Q 137,150 132,160" stroke="#1a3a5c" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Mechas mais claras -->
  <path d="M 74,105 Q 70,120 67,140" stroke="#2a5a8c" stroke-width="3" fill="none" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M 126,105 Q 130,120 133,140" stroke="#2a5a8c" stroke-width="3" fill="none" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Olhos (tom azul profundo) -->
  <ellipse cx="89" cy="105" rx="5.5" ry="5" fill="#0a1018"/>
  <ellipse cx="111" cy="105" rx="5.5" ry="5" fill="#0a1018"/>
  <circle cx="89" cy="105" r="3.2" fill="#4db8e8" fill-opacity="0.9"/>
  <circle cx="111" cy="105" r="3.2" fill="#4db8e8" fill-opacity="0.9"/>
  <circle cx="90.2" cy="103.5" r="1.1" fill="white"/>
  <circle cx="112.2" cy="103.5" r="1.1" fill="white"/>
  <!-- Sobrancelhas (expressão calma e atenta) -->
  <path d="M 84,98 Q 89,96.5 94,98" stroke="#1a3a5c" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M 106,98 Q 111,96.5 116,98" stroke="#1a3a5c" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- Boca (leve sorriso contido) -->
  <path d="M 94,121 Q 100,123.5 106,121" stroke="#a06848" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- Orelhas -->
  <ellipse cx="72" cy="108" rx="4.5" ry="7" fill="#c89a68"/>
  <ellipse cx="128" cy="108" rx="4.5" ry="7" fill="#c89a68"/>
  <!-- Gotas/partículas de água -->
  <ellipse cx="52" cy="68" rx="1.8" ry="2.5" fill="#4db8e8" fill-opacity="0.7" filter="url(#glow_agua)"/>
  <ellipse cx="150" cy="75" rx="1.5" ry="2.2" fill="#4db8e8" fill-opacity="0.6"/>
  <ellipse cx="58" cy="135" rx="1.5" ry="2" fill="#60c8f0" fill-opacity="0.7"/>
  <ellipse cx="144" cy="128" rx="1.8" ry="2.5" fill="#60c8f0" fill-opacity="0.6"/>
  <ellipse cx="80" cy="48" rx="1.2" ry="1.8" fill="#4db8e8" fill-opacity="0.5"/>
  <ellipse cx="125" cy="45" rx="1.5" ry="2" fill="#4db8e8" fill-opacity="0.5"/>
  <!-- Roupas (tons oceânicos) -->
  <path d="M 60,168 Q 72,156 100,153 Q 128,156 140,168 L 143,183 Q 100,188 57,183Z"
        fill="#1a4a6a" clip-path="url(#circle_coral)"/>
  <!-- Detalhe: colar com gota -->
  <circle cx="100" cy="150" r="3" fill="#4db8e8" fill-opacity="0.8"/>
  <ellipse cx="100" cy="151.5" rx="1.5" ry="2" fill="#80d8f8" fill-opacity="0.6"/>

  <!-- Nome e elemento -->
  <text x="100" y="207" font-family="Georgia, serif" font-size="18" font-weight="bold"
        fill="#4db8e8" text-anchor="middle" letter-spacing="2">CORAL</text>
  <text x="100" y="225" font-family="Georgia, serif" font-size="10"
        fill="#d0d0d0" text-anchor="middle" letter-spacing="3" font-style="italic">Maga da Água</text>
  <!-- Divisor decorativo -->
  <line x1="60" y1="232" x2="90" y2="232" stroke="#4db8e8" stroke-width="0.7" stroke-opacity="0.6"/>
  <ellipse cx="100" cy="232" rx="3" ry="4" fill="#4db8e8" fill-opacity="0.6"/>
  <line x1="110" y1="232" x2="140" y2="232" stroke="#4db8e8" stroke-width="0.7" stroke-opacity="0.6"/>
  <!-- Moldura externa -->
  <rect x="3" y="3" width="194" height="254" rx="8" fill="none" stroke="#4db8e8" stroke-width="0.8" stroke-opacity="0.3"/>
</svg>
