<!-- KRAWZ — O Coração da Colmeia · Livro 1 · Capa -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg_main" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040804"/>
      <stop offset="30%" stop-color="#0a1a0a"/>
      <stop offset="60%" stop-color="#081408"/>
      <stop offset="100%" stop-color="#040604"/>
    </linearGradient>
    <radialGradient id="glow_center" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#c9a030" stop-opacity=".15"/>
      <stop offset="60%" stop-color="#c9a030" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#c9a030" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow_tree" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#3a7a2a" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#3a7a2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hex_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0c040" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#c9a030" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur_soft">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glow_filter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ═══ FUNDO ═══ -->
  <rect width="600" height="900" fill="url(#bg_main)"/>
  <rect width="600" height="900" fill="url(#glow_center)"/>
  <rect width="600" height="900" fill="url(#glow_tree)"/>

  <!-- ═══ ÁRVORE-MUNDO (invertida — raízes para cima) ═══ -->
  <!-- Raízes superiores -->
  <g stroke="#2a4a1a" fill="none" stroke-linecap="round" opacity=".5">
    <path d="M300,320 C280,260 240,200 180,140" stroke-width="6"/>
    <path d="M180,140 C160,120 130,100 90,80" stroke-width="3"/>
    <path d="M180,140 C170,125 175,105 190,90" stroke-width="2.5"/>
    <path d="M300,320 C320,260 360,200 420,140" stroke-width="6"/>
    <path d="M420,140 C440,120 470,100 510,80" stroke-width="3"/>
    <path d="M420,140 C430,125 425,105 410,90" stroke-width="2.5"/>
    <path d="M290,310 C260,250 220,200 170,170" stroke-width="4"/>
    <path d="M310,310 C340,250 380,200 430,170" stroke-width="4"/>
    <path d="M280,300 C250,240 210,190 160,160" stroke-width="2.5" opacity=".3"/>
    <path d="M320,300 C350,240 390,190 440,160" stroke-width="2.5" opacity=".3"/>
    <!-- Raízes finas -->
    <path d="M270,280 C240,230 200,180 150,150" stroke-width="1.5" opacity=".25"/>
    <path d="M330,280 C360,230 400,180 450,150" stroke-width="1.5" opacity=".25"/>
    <path d="M260,260 C230,210 190,160 140,130" stroke-width="1" opacity=".2"/>
    <path d="M340,260 C370,210 410,160 460,130" stroke-width="1" opacity=".2"/>
  </g>

  <!-- Tronco principal -->
  <path d="M280,320 C278,380 275,440 278,500 C280,540 285,580 295,620
           C305,580 310,540 312,500 C315,440 312,380 310,320 Z"
        fill="#1a2e12" stroke="#2a4a1a" stroke-width="1" opacity=".6"/>
  <!-- Textura tronco -->
  <g stroke="#0a1a08" stroke-width=".5" opacity=".3">
    <path d="M285,330 C284,400 283,470 286,550 C288,580 292,610 295,620"/>
    <path d="M295,325 C294,400 294,470 295,550 C296,580 298,610 300,620"/>
    <path d="M305,330 C306,400 307,470 304,550 C303,580 301,610 300,620"/>
  </g>

  <!-- Copa (embaixo — árvore invertida) -->
  <ellipse cx="300" cy="660" rx="140" ry="50" fill="#1a3a12" fill-opacity=".3"/>
  <ellipse cx="300" cy="650" rx="110" ry="35" fill="#2a4a1a" fill-opacity=".2"/>
  <ellipse cx="300" cy="645" rx="80" ry="25" fill="#1a3a12" fill-opacity=".15"/>

  <!-- ═══ COLMEIA CENTRAL (hexágonos dourados) ═══ -->
  <g filter="url(#glow_filter)" opacity=".8">
    <!-- Hexágono central grande -->
    <polygon points="300,395 320,408 320,432 300,445 280,432 280,408"
             fill="none" stroke="#c9a030" stroke-width="1.5"/>
    <!-- Anel de hexágonos -->
    <polygon points="300,365 315,374 315,392 300,401 285,392 285,374"
             fill="none" stroke="#c9a030" stroke-width="1" opacity=".7"/>
    <polygon points="330,380 345,389 345,407 330,416 315,407 315,389"
             fill="none" stroke="#c9a030" stroke-width="1" opacity=".6"/>
    <polygon points="330,410 345,419 345,437 330,446 315,437 315,419"
             fill="none" stroke="#c9a030" stroke-width="1" opacity=".6"/>
    <polygon points="300,425 315,434 315,452 300,461 285,452 285,434"
             fill="none" stroke="#c9a030" stroke-width="1" opacity=".7"/>
    <polygon points="270,410 285,419 285,437 270,446 255,437 255,419"
             fill="none" stroke="#c9a030" stroke-width="1" opacity=".6"/>
    <polygon points="270,380 285,389 285,407 270,416 255,407 255,389"
             fill="none" stroke="#c9a030" stroke-width="1" opacity=".6"/>
    <!-- Hexágonos exteriores (mais transparentes) -->
    <polygon points="300,340 312,347 312,361 300,368 288,361 288,347"
             fill="none" stroke="#c9a030" stroke-width=".8" opacity=".35"/>
    <polygon points="350,370 362,377 362,391 350,398 338,391 338,377"
             fill="none" stroke="#c9a030" stroke-width=".8" opacity=".3"/>
    <polygon points="350,430 362,437 362,451 350,458 338,451 338,437"
             fill="none" stroke="#c9a030" stroke-width=".8" opacity=".3"/>
    <polygon points="300,460 312,467 312,481 300,488 288,481 288,467"
             fill="none" stroke="#c9a030" stroke-width=".8" opacity=".35"/>
    <polygon points="250,430 262,437 262,451 250,458 238,451 238,437"
             fill="none" stroke="#c9a030" stroke-width=".8" opacity=".3"/>
    <polygon points="250,370 262,377 262,391 250,398 238,391 238,377"
             fill="none" stroke="#c9a030" stroke-width=".8" opacity=".3"/>
  </g>
  <!-- Glow central -->
  <ellipse cx="300" cy="420" rx="30" ry="35" fill="url(#hex_glow)" fill-opacity=".2"/>

  <!-- ═══ ABELHAS (silhuetas pequenas) ═══ -->
  <g fill="#c9a030" opacity=".5">
    <!-- Abelha 1 -->
    <ellipse cx="230" cy="360" rx="4" ry="2.5" transform="rotate(-20 230 360)"/>
    <ellipse cx="228" cy="358" rx="2.5" ry="1.5" fill="#e8c040" fill-opacity=".6" transform="rotate(-40 228 358)"/>
    <!-- Abelha 2 -->
    <ellipse cx="370" cy="380" rx="3.5" ry="2" transform="rotate(15 370 380)"/>
    <ellipse cx="372" cy="378" rx="2" ry="1.2" fill="#e8c040" fill-opacity=".6" transform="rotate(30 372 378)"/>
    <!-- Abelha 3 -->
    <ellipse cx="255" cy="460" rx="3" ry="2" transform="rotate(10 255 460)"/>
    <!-- Abelha 4 -->
    <ellipse cx="348" cy="350" rx="3" ry="1.8" transform="rotate(-10 348 350)"/>
    <!-- Abelha 5 -->
    <ellipse cx="330" cy="470" rx="3.5" ry="2" transform="rotate(25 330 470)"/>
  </g>

  <!-- ═══ PARTÍCULAS / VAGALUMES ═══ -->
  <g fill="#c9a030">
    <circle cx="150" cy="200" r="2" fill-opacity=".4"/>
    <circle cx="450" cy="180" r="1.5" fill-opacity=".3"/>
    <circle cx="120" cy="400" r="1.5" fill-opacity=".3"/>
    <circle cx="480" cy="420" r="2" fill-opacity=".35"/>
    <circle cx="180" cy="550" r="1.5" fill-opacity=".25"/>
    <circle cx="420" cy="570" r="1.5" fill-opacity=".3"/>
    <circle cx="100" cy="300" r="1" fill-opacity=".2"/>
    <circle cx="500" cy="310" r="1.2" fill-opacity=".2"/>
    <circle cx="200" cy="680" r="1.5" fill-opacity=".2"/>
    <circle cx="400" cy="700" r="1.2" fill-opacity=".2"/>
  </g>
  <!-- Partículas verdes (vida) -->
  <g fill="#5aaa40">
    <circle cx="220" cy="600" r="1.5" fill-opacity=".25"/>
    <circle cx="380" cy="620" r="1.2" fill-opacity=".2"/>
    <circle cx="250" cy="650" r="1" fill-opacity=".2"/>
    <circle cx="350" cy="660" r="1.5" fill-opacity=".2"/>
  </g>

  <!-- ═══ TÍTULO: KRAWZ ═══ -->
  <rect x="0" y="60" width="600" height="130" fill="#000000" fill-opacity=".5"/>
  <line x1="40" y1="62" x2="560" y2="62" stroke="#c9a030" stroke-width="1" stroke-opacity=".5"/>
  <line x1="40" y1="188" x2="560" y2="188" stroke="#c9a030" stroke-width="1" stroke-opacity=".5"/>

  <!-- Sombra -->
  <text x="302" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="bold"
        fill="#5a4010" text-anchor="middle" letter-spacing="12" fill-opacity=".5">KRAWZ</text>
  <!-- Título principal -->
  <text x="300" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="bold"
        fill="#c9a030" text-anchor="middle" letter-spacing="12">KRAWZ</text>

  <!-- Subtítulo -->
  <text x="300" y="165" font-family="Georgia, 'Times New Roman', serif" font-size="15"
        fill="#a89060" text-anchor="middle" letter-spacing="3">O CORAÇÃO DA COLMEIA</text>

  <!-- Ornamento separador -->
  <line x1="200" y1="178" x2="270" y2="178" stroke="#c9a030" stroke-width=".5" stroke-opacity=".4"/>
  <text x="300" y="182" font-family="Georgia, serif" font-size="8" fill="#c9a030" fill-opacity=".5" text-anchor="middle">◆</text>
  <line x1="330" y1="178" x2="400" y2="178" stroke="#c9a030" stroke-width=".5" stroke-opacity=".4"/>

  <!-- ═══ INDICADOR LIVRO 1 ═══ -->
  <text x="300" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="11"
        fill="#8a8470" text-anchor="middle" letter-spacing="5" font-style="italic">LIVRO 1</text>

  <!-- ═══ VINES LATERAIS ═══ -->
  <g stroke="#2a5a1a" fill="none" stroke-width="1.5" opacity=".15">
    <!-- Esquerda -->
    <path d="M30,200 C35,260 25,320 30,380 C35,440 25,500 30,560 C35,620 25,680 30,740"/>
    <circle cx="28" cy="280" r="3" fill="#2a5a1a"/>
    <circle cx="32" cy="400" r="4" fill="#2a5a1a"/>
    <circle cx="27" cy="520" r="3" fill="#2a5a1a"/>
    <circle cx="33" cy="650" r="3.5" fill="#2a5a1a"/>
    <!-- Direita -->
    <path d="M570,200 C565,260 575,320 570,380 C565,440 575,500 570,560 C565,620 575,680 570,740"/>
    <circle cx="572" cy="280" r="3" fill="#2a5a1a"/>
    <circle cx="568" cy="400" r="4" fill="#2a5a1a"/>
    <circle cx="573" cy="520" r="3" fill="#2a5a1a"/>
    <circle cx="567" cy="650" r="3.5" fill="#2a5a1a"/>
  </g>

  <!-- ═══ RODAPÉ / AUTOR ═══ -->
  <rect x="0" y="830" width="600" height="70" fill="#000000" fill-opacity=".5"/>
  <line x1="40" y1="832" x2="560" y2="832" stroke="#c9a030" stroke-width=".8" stroke-opacity=".4"/>
  <text x="300" y="868" font-family="Georgia, 'Times New Roman', serif" font-size="14"
        fill="#c9a030" text-anchor="middle" letter-spacing="5">LUX VESPER</text>

  <!-- ═══ MOLDURA DECORATIVA ═══ -->
  <!-- Cantos -->
  <path d="M 18,18 L 18,55 M 18,18 L 55,18" stroke="#c9a030" stroke-width="1.5" fill="none" stroke-opacity=".5"/>
  <path d="M 582,18 L 582,55 M 582,18 L 545,18" stroke="#c9a030" stroke-width="1.5" fill="none" stroke-opacity=".5"/>
  <path d="M 18,882 L 18,845 M 18,882 L 55,882" stroke="#c9a030" stroke-width="1.5" fill="none" stroke-opacity=".5"/>
  <path d="M 582,882 L 582,845 M 582,882 L 545,882" stroke="#c9a030" stroke-width="1.5" fill="none" stroke-opacity=".5"/>
  <!-- Borda interna sutil -->
  <rect x="12" y="12" width="576" height="876" rx="2" fill="none" stroke="#c9a030" stroke-width=".5" stroke-opacity=".15"/>
</svg>
