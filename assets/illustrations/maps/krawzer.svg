<!-- Mapa de Krawzer — versão canônica revisada
     Geografia: Deserto do Fogo cerca o Reino da Pedra ao N/W/S
                Reino da Água = faixa costeira estreita ao Leste
                Reino do Vento = canto Noroeste (além do deserto) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
