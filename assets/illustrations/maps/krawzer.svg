<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <linearGradient id="paper_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3f0"/>
      <stop offset="100%" stop-color="#e8ddf5"/>
    </linearGradient>

    <filter id="paper_noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="2"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.5"/>
    </filter>

    <filter id="shadow_light">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fundo papel -->
  <rect width="1200" height="1600" fill="url(#paper_bg)"/>
  
  <!-- Manchas envelhecimento -->
  <ellipse cx="100" cy="150" rx="120" ry="100" fill="#b8a890" opacity="0.05"/>
  <ellipse cx="1100" cy="200" rx="140" ry="120" fill="#8b7a68" opacity="0.04"/>
  <ellipse cx="150" cy="1450" rx="130" ry="110" fill="#b8a890" opacity="0.04"/>
  <ellipse cx="1050" cy="1400" rx="150" ry="130" fill="#8b7a68" opacity="0.03"/>

  <!-- Borda -->
  <rect x="40" y="40" width="1120" height="1520" fill="none" stroke="#6a5a4a" stroke-width="3"/>
  <rect x="50" y="50" width="1100" height="1500" fill="none" stroke="#a89a88" stroke-width="0.5" opacity="0.5"/>

  <!-- TÍTULO -->
  <text x="600" y="90" font-family="Georgia, serif" font-size="64" font-weight="bold" 
        fill="#2a1a0a" text-anchor="middle" letter-spacing="2">KRAWZER</text>
  
  <line x1="250" y1="105" x2="400" y2="105" stroke="#4a3a2a" stroke-width="1" opacity="0.4"/>
  <line x1="800" y1="105" x2="950" y2="105" stroke="#4a3a2a" stroke-width="1" opacity="0.4"/>

  <text x="600" y="135" font-family="Georgia, serif" font-size="18" fill="#6a5a4a" 
        text-anchor="middle" font-style="italic">A Árvore Invertida</text>

  <!-- ① ALDEIA DA FOLHA (EMBAIXO) -->
  <g id="aldeia_folha_base">
    <!-- FOLHA ÚNICA -->
    <polygon points="600,1520 520,1380 540,1280 580,1250 620,1250 660,1280 680,1380" 
             fill="#3a6a2a" stroke="#1a3a08" stroke-width="3" filter="url(#paper_noise)"/>

    <!-- Veios da folha -->
    <line x1="600" y1="1250" x2="600" y2="1520" stroke="#1a3a08" stroke-width="2.5" opacity="0.35"/>
    <line x1="560" y1="1300" x2="600" y2="1520" stroke="#1a3a08" stroke-width="1.5" opacity="0.25"/>
    <line x1="640" y1="1300" x2="600" y2="1520" stroke="#1a3a08" stroke-width="1.5" opacity="0.25"/>
    <line x1="540" y1="1380" x2="660" y2="1380" stroke="#1a3a08" stroke-width="1" opacity="0.2"/>
    <line x1="535" y1="1450" x2="665" y2="1450" stroke="#1a3a08" stroke-width="1" opacity="0.2"/>

    <!-- MARCADOR - Aldeia -->
    <circle cx="600" cy="1400" r="24" fill="#5a8a45" stroke="#1a3a08" stroke-width="2" filter="url(#shadow_light)"/>
    <polygon points="595,1390 605,1390 608,1410 592,1410" fill="#1a3a08" opacity="0.8"/>
    <polygon points="590,1415 600,1420 595,1430" fill="#1a3a08" opacity="0.8"/>

    <!-- TEXTO -->
    <text x="600" y="1570" font-family="Georgia, serif" font-size="32" font-weight="bold" 
          fill="#2a1a0a" text-anchor="middle">Aldeia da Folha</text>
  </g>

  <!-- ② GALHO ÚNICO - Linha reta conectando folha ao tronco -->
  <g id="galho_unico">
    <!-- GALHO PRINCIPAL - Linha reta e grossa -->
    <line x1="600" y1="1250" x2="600" y2="900" stroke="#5a4a38" stroke-width="42" stroke-linecap="round" opacity="0.9"/>

    <!-- Folhas pequenas penduradas -->
    <polygon points="550,1180 535,1150 545,1170" fill="#2a5a1a" opacity="0.6" filter="url(#shadow_light)"/>
    <polygon points="650,1050 665,1020 655,1040" fill="#2a5a1a" opacity="0.6" filter="url(#shadow_light)"/>
    <polygon points="580,920 565,890 575,910" fill="#2a5a1a" opacity="0.55" filter="url(#shadow_light)"/>

    <!-- Marcador do galho -->
    <circle cx="600" cy="1075" r="26" fill="#7a9a4a" stroke="#4a6a2a" stroke-width="2.5" filter="url(#shadow_light)"/>
    <circle cx="600" cy="1075" r="15" fill="#9aba6a" opacity="0.75"/>

    <!-- TEXTO - Galho -->
    <text x="350" y="1105" font-family="Georgia, serif" font-size="32" font-weight="bold" 
          fill="#2a1a0a">Galho</text>
    <text x="350" y="1135" font-family="Georgia, serif" font-size="14" fill="#6a5a4a" 
          font-style="italic">Campos e Transição</text>
  </g>

  <!-- ③ TRONCO - Centro -->
  <g id="tronco_central">
    <!-- Tronco principal -->
    <polygon points="560,900 640,900 650,600 550,600" 
             fill="#7a6a52" stroke="#3a2a18" stroke-width="2.5" filter="url(#paper_noise)"/>

    <!-- Sombreado lateral -->
    <polygon points="640,900 650,890 660,600 650,600" fill="#5a4a38" opacity="0.25"/>

    <!-- Textura vertical -->
    <line x1="575" y1="900" x2="575" y2="600" stroke="#3a2a18" stroke-width="1.5" opacity="0.2"/>
    <line x1="600" y1="900" x2="600" y2="600" stroke="#3a2a18" stroke-width="1" opacity="0.15"/>
    <line x1="625" y1="900" x2="625" y2="600" stroke="#3a2a18" stroke-width="1.5" opacity="0.2"/>

    <!-- Marcas no tronco -->
    <line x1="550" y1="770" x2="650" y2="770" stroke="#3a2a18" stroke-width="2" opacity="0.2"/>
    <line x1="550" y1="670" x2="650" y2="670" stroke="#3a2a18" stroke-width="2" opacity="0.2"/>

    <!-- Estruturas industriais -->
    <rect x="572" y="720" width="16" height="26" fill="#3a2a18" stroke="#1a0a08" stroke-width="1" opacity="0.7"/>
    <rect x="612" y="720" width="16" height="26" fill="#3a2a18" stroke="#1a0a08" stroke-width="1" opacity="0.7"/>
    <circle cx="580" cy="715" r="2.5" fill="#6a5a4a" opacity="0.4"/>
    <circle cx="620" cy="715" r="2.5" fill="#6a5a4a" opacity="0.4"/>

    <!-- Marcador tronco -->
    <circle cx="600" cy="750" r="27" fill="#6a5a48" stroke="#2a1a08" stroke-width="2.5" filter="url(#shadow_light)"/>
    <circle cx="600" cy="750" r="16" fill="#8a7a68" opacity="0.75"/>

    <!-- TEXTO - Tronco -->
    <text x="800" y="765" font-family="Georgia, serif" font-size="32" font-weight="bold" 
          fill="#2a1a0a">Tronco</text>
    <text x="800" y="795" font-family="Georgia, serif" font-size="14" fill="#6a5a4a">Zona Industrial de Orin</text>
  </g>

  <!-- ④ RAÍZES -->
  <g id="raizes_invertidas">
    <!-- Raízes principais -->
    <polygon points="560,600 490,500 450,380" fill="none" stroke="#5a5a3a" stroke-width="26" stroke-linecap="miter" opacity="0.8" filter="url(#paper_noise)"/>
    <polygon points="640,600 710,500 750,380" fill="none" stroke="#5a5a3a" stroke-width="26" stroke-linecap="miter" opacity="0.8" filter="url(#paper_noise)"/>

    <!-- Sub-raízes menores -->
    <line x1="450" y1="380" x2="400" y2="280" stroke="#5a5a3a" stroke-width="14" opacity="0.7"/>
    <line x1="750" y1="380" x2="800" y2="280" stroke="#5a5a3a" stroke-width="14" opacity="0.7"/>

    <!-- Raízes finas terminais -->
    <line x1="400" y1="280" x2="380" y2="180" stroke="#5a5a3a" stroke-width="8" opacity="0.6"/>
    <line x1="800" y1="280" x2="820" y2="180" stroke="#5a5a3a" stroke-width="8" opacity="0.6"/>

    <!-- Estruturas da capital -->
    <rect x="575" y="620" width="18" height="22" fill="#5a6a4a" stroke="#3a4a2a" stroke-width="1" opacity="0.65"/>
    <rect x="607" y="615" width="18" height="22" fill="#5a6a4a" stroke="#3a4a2a" stroke-width="1" opacity="0.65"/>

    <!-- Marcador raízes -->
    <circle cx="600" cy="550" r="26" fill="#6a7a5a" stroke="#3a5a2a" stroke-width="2.5" filter="url(#shadow_light)"/>
    <circle cx="600" cy="550" r="15" fill="#8a9a7a" opacity="0.75"/>

    <!-- TEXTO - Raízes -->
    <text x="900" y="570" font-family="Georgia, serif" font-size="32" font-weight="bold" 
          fill="#2a1a0a">Raízes</text>
    <text x="900" y="600" font-family="Georgia, serif" font-size="14" fill="#6a5a4a">Capital Orgânica Subterrânea</text>
  </g>

  <!-- ⑤ CASTELO DE PEDRA - NO MEIO DAS RAÍZES -->
  <g id="castelo_topo">
    <!-- Raízes conectando ao castelo -->
    <line x1="380" y1="180" x2="360" y2="240" stroke="#5a5a3a" stroke-width="6" opacity="0.5"/>
    <line x1="820" y1="180" x2="840" y2="240" stroke="#5a5a3a" stroke-width="6" opacity="0.5"/>

    <!-- Base castelo -->
    <polygon points="500,280 700,280 720,340 480,340" fill="#8a7a68" stroke="#3a2817" stroke-width="2.5" filter="url(#paper_noise)"/>

    <!-- Torres cantos -->
    <polygon points="480,260 510,240 525,340 495,350" fill="#7a6a58" stroke="#3a2817" stroke-width="1.5" opacity="0.9"/>
    <polygon points="690,260 720,240 735,340 705,350" fill="#7a6a58" stroke="#3a2817" stroke-width="1.5" opacity="0.9"/>

    <!-- Torre central -->
    <polygon points="550,210 650,210 665,340 535,340" fill="#9a8a78" stroke="#3a2817" stroke-width="2"/>

    <!-- Merlões -->
    <polygon points="505,255 510,235 515,255" fill="#3a2817" opacity="0.9"/>
    <polygon points="540,240 545,220 550,240" fill="#3a2817" opacity="0.9"/>
    <polygon points="575,235 580,215 585,235" fill="#3a2817" opacity="0.9"/>
    <polygon points="610,235 615,215 620,235" fill="#3a2817" opacity="0.9"/>
    <polygon points="645,240 650,220 655,240" fill="#3a2817" opacity="0.9"/>
    <polygon points="685,255 690,235 695,255" fill="#3a2817" opacity="0.9"/>

    <!-- Portão -->
    <rect x="595" y="325" width="10" height="22" fill="#1a0a00"/>
    <circle cx="592" cy="340" r="1.5" fill="#5a4a38" opacity="0.6"/>

    <!-- Muralhas -->
    <line x1="460" y1="340" x2="490" y2="340" stroke="#6a5a48" stroke-width="2" opacity="0.5"/>
    <line x1="710" y1="340" x2="740" y2="340" stroke="#6a5a48" stroke-width="2" opacity="0.5"/>

    <!-- Marcador castelo -->
    <polygon points="600,360 615,355 620,375 605,380" fill="#7a6a58" stroke="#3a2817" stroke-width="2.5"/>
    <circle cx="607.5" cy="365" r="15" fill="#9a8a78" opacity="0.85" filter="url(#shadow_light)"/>
    <text x="607.5" y="372" font-family="Georgia, serif" font-size="13" font-weight="bold" 
          fill="#1a0a00" text-anchor="middle">FIM</text>

    <!-- TEXTO - Castelo -->
    <text x="600" y="420" font-family="Georgia, serif" font-size="32" font-weight="bold" 
          fill="#2a1a0a" text-anchor="middle">Castelo de Pedra</text>
    <text x="600" y="445" font-family="Georgia, serif" font-size="13" fill="#6a5a4a" 
          text-anchor="middle" font-style="italic">Fortaleza do Rei Pedro</text>
    <text x="600" y="465" font-family="Georgia, serif" font-size="13" fill="#6a5a4a" 
          text-anchor="middle" font-weight="bold">DESTINO FINAL</text>
  </g>

  <!-- LINHAS DE CONEXÃO -->
  <g stroke="#6a5a4a" stroke-width="2.5" fill="none" opacity="0.4" stroke-dasharray="12,8">
    <path d="M 600,1250 L 600,1150"/>
    <path d="M 600,950 L 600,900"/>
    <path d="M 600,600 L 600,500"/>
    <path d="M 500,200 L 450,150 L 400,100"/>
    <path d="M 700,200 L 750,150 L 800,100"/>
  </g>

  <!-- RODAPÉ -->
  <text x="600" y="1590" font-family="Georgia, serif" font-size="12" fill="#8b7a68" 
        text-anchor="middle" font-style="italic">
    O Coração da Colmeia — Krawzer, a Árvore Invertida
  </text>

  <!-- Decorações -->
  <g opacity="0.15">
    <path d="M 100,300 Q 110,320 100,360" stroke="#8b7a68" stroke-width="1.5" fill="none"/>
    <circle cx="105" cy="330" r="2" fill="#8b7a68"/>
  </g>

  <g opacity="0.15">
    <path d="M 1100,400 Q 1090,420 1100,460" stroke="#8b7a68" stroke-width="1.5" fill="none"/>
    <circle cx="1095" cy="430" r="2" fill="#8b7a68"/>
  </g>
</svg>
