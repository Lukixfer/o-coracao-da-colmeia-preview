<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flipbook · O Coração da Colmeia</title>
    <meta name="description" content="Leitura em formato livro com efeito de folhear (PT/EN)." />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./flip-reader.css" />
  </head>
  <body>
    <div class="flip-app">
      <header class="flip-header">
        <a class="back" href="./index.html" aria-label="Voltar">←</a>
        <h1>O Coração da Colmeia · Flipbook</h1>
        <div class="controls">
          <label>
            <span data-i18n="cap">Capítulo</span>
            <select id="chapterSelect" aria-label="Selecionar capítulo"></select>
          </label>
          <span id="wipTag" class="wip" style="display:none">EN preview · WIP</span>
          <button id="fontDec" title="Diminuir fonte" aria-label="Diminuir fonte">A−</button>
          <button id="fontInc" title="Aumentar fonte" aria-label="Aumentar fonte">A+</button>
          <button id="themeToggle" title="Tema">🌓</button>
          <a id="openStdReader" class="alt-link" href="reader.html" data-i18n="stdReader">Leitor padrão</a>
        </div>
      </header>

      <main class="stage">
        <div id="book" class="book" aria-live="polite" aria-label="Livro, use setas para folhear"></div>
      </main>

      <nav class="nav">
        <button id="prev" class="nav-btn" aria-label="Página anterior">⟨</button>
        <div class="page-info"><span id="pageCurrent">1</span> / <span id="pageTotal">—</span></div>
        <button id="next" class="nav-btn" aria-label="Próxima página">⟩</button>
      </nav>
    </div>

    <script src="./flip-reader.js"></script>
  </body>
  </html>
