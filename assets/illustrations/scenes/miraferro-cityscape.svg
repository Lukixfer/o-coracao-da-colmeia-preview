<!-- Miraferro — Paisagem da Cidade Distópica -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <linearGradient id="sky_mf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2030"/>
      <stop offset="50%" stop-color="#3a3040"/>
      <stop offset="100%" stop-color="#504858"/>
    </linearGradient>
    <linearGradient id="fog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#504858" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6a6070" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="smog">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Céu poluído -->
  <rect width="480" height="200" fill="url(#sky_mf)"/>

  <!-- Nuvens pesadas de poluição -->
  <ellipse cx="80" cy="30" rx="60" ry="18" fill="#4a4050" fill-opacity="0.5"/>
  <ellipse cx="200" cy="22" rx="80" ry="16" fill="#3a3040" fill-opacity="0.4"/>
  <ellipse cx="380" cy="28" rx="70" ry="20" fill="#4a4050" fill-opacity="0.45"/>

  <!-- Arranha-céus distantes (fundo) -->
  <rect x="20" y="60" width="18" height="120" fill="#1a1820" rx="1"/>
  <rect x="42" y="45" width="14" height="135" fill="#222028" rx="1"/>
  <rect x="60" y="70" width="20" height="110" fill="#1a1820" rx="1"/>
  <rect x="85" y="50" width="16" height="130" fill="#28252e" rx="1"/>
  <rect x="105" y="65" width="22" height="115" fill="#1e1c24" rx="1"/>
  <rect x="132" y="40" width="18" height="140" fill="#222028" rx="1"/>
  <rect x="155" y="55" width="14" height="125" fill="#1a1820" rx="1"/>
  <rect x="174" y="72" width="20" height="108" fill="#28252e" rx="1"/>
  <rect x="200" y="35" width="24" height="145" fill="#1e1c24" rx="1"/>
  <rect x="228" y="58" width="16" height="122" fill="#222028" rx="1"/>
  <rect x="248" y="42" width="20" height="138" fill="#1a1820" rx="1"/>
  <rect x="272" y="68" width="18" height="112" fill="#28252e" rx="1"/>
  <rect x="295" y="48" width="22" height="132" fill="#1e1c24" rx="1"/>
  <rect x="322" y="62" width="14" height="118" fill="#222028" rx="1"/>
  <rect x="340" y="38" width="20" height="142" fill="#1a1820" rx="1"/>
  <rect x="365" y="55" width="16" height="125" fill="#28252e" rx="1"/>
  <rect x="385" y="70" width="22" height="110" fill="#1e1c24" rx="1"/>
  <rect x="412" y="45" width="18" height="135" fill="#222028" rx="1"/>
  <rect x="435" y="60" width="20" height="120" fill="#1a1820" rx="1"/>
  <rect x="458" y="50" width="16" height="130" fill="#28252e" rx="1"/>

  <!-- Janelas (pontos de luz fracos) -->
  <g fill="#505060" fill-opacity="0.4">
    <rect x="24" y="70" width="3" height="2"/><rect x="24" y="80" width="3" height="2"/>
    <rect x="30" y="90" width="3" height="2"/><rect x="24" y="100" width="3" height="2"/>
    <rect x="46" y="55" width="2" height="2"/><rect x="46" y="70" width="2" height="2"/>
    <rect x="204" y="45" width="4" height="2"/><rect x="210" y="60" width="4" height="2"/>
    <rect x="204" y="80" width="4" height="2"/><rect x="252" y="55" width="3" height="2"/>
    <rect x="252" y="70" width="3" height="2"/><rect x="344" y="48" width="3" height="2"/>
    <rect x="344" y="65" width="3" height="2"/><rect x="390" y="80" width="3" height="2"/>
  </g>

  <!-- Luzes vermelhas nos topos (antenas, drones) -->
  <circle cx="50" cy="44" r="1.5" fill="#ff3030" fill-opacity="0.7"/>
  <circle cx="140" cy="39" r="1.5" fill="#ff3030" fill-opacity="0.6"/>
  <circle cx="212" cy="34" r="2" fill="#ff3030" fill-opacity="0.7"/>
  <circle cx="258" cy="41" r="1.5" fill="#ff3030" fill-opacity="0.6"/>
  <circle cx="350" cy="37" r="1.5" fill="#ff3030" fill-opacity="0.7"/>
  <circle cx="420" cy="44" r="1.5" fill="#ff3030" fill-opacity="0.6"/>

  <!-- Smog/neblina na base -->
  <rect x="0" y="150" width="480" height="50" fill="url(#fog)"/>
  <ellipse cx="120" cy="170" rx="80" ry="20" fill="#6a6070" fill-opacity="0.3" filter="url(#smog)"/>
  <ellipse cx="320" cy="175" rx="100" ry="18" fill="#6a6070" fill-opacity="0.25" filter="url(#smog)"/>

  <!-- Drones voando -->
  <g fill="#808090" fill-opacity="0.6">
    <rect x="95" y="50" width="6" height="2" rx="1"/>
    <rect x="310" y="65" width="5" height="1.5" rx="1"/>
    <rect x="410" y="38" width="5" height="1.5" rx="1"/>
  </g>
  <circle cx="98" cy="51" r="0.8" fill="#60e0ff" fill-opacity="0.8"/>
  <circle cx="312.5" cy="65.5" r="0.6" fill="#60e0ff" fill-opacity="0.7"/>

  <!-- Texto -->
  <text x="240" y="192" font-family="Georgia, serif" font-size="11"
        fill="#8a8090" text-anchor="middle" letter-spacing="4" font-style="italic">MIRAFERRO</text>
</svg>
