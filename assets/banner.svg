<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">O Coração da Colmeia — Preview Pública</title>
  <desc id="desc">Banner da obra O Coração da Colmeia, com gradiente suave e tipografia destacada.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b0a2a"/>
      <stop offset="50%" stop-color="#3b2375"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#g)"/>
  <g filter="url(#shadow)">
    <text x="600" y="160" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">O Coração da Colmeia</text>
    <text x="600" y="210" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#e9ddff">Preview Pública • OSDB1..OSDB6</text>
  </g>
  <circle cx="1080" cy="300" r="100" fill="#ffffff" opacity="0.05"/>
  <circle cx="100" cy="60" r="60" fill="#ffffff" opacity="0.08"/>
</svg>
