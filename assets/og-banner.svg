<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">O Coração da Colmeia — Preview pública</title>
  <desc id="desc">Imagem OpenGraph 1200x630 com título e subtítulo da obra.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1021"/>
      <stop offset="60%" stop-color="#3b2375"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1050" cy="540" r="140" fill="#ffffff" opacity="0.05"/>
  <circle cx="140" cy="120" r="80" fill="#ffffff" opacity="0.06"/>

  <g filter="url(#shadow)">
    <text x="80" y="280" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff">O Coração da Colmeia</text>
    <rect x="80" y="295" width="540" height="6" rx="3" fill="url(#glow)"/>
    <text x="80" y="360" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#efe7ff">Preview pública • OSDB1..OSDB6</text>
    <text x="80" y="410" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#cfc7ff">Miraferro × Krawzer — tecnologia, magia e memória</text>
  </g>

  <g>
    <rect x="80" y="460" rx="12" ry="12" width="260" height="54" fill="#8a2be2"/>
    <text x="210" y="496" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#fff">Ler a preview</text>
  </g>

  <g opacity="0.9">
  <text x="80" y="560" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#beb6ff">github.com/Lukixfer/o-coracao-da-colmeia</text>
  </g>
</svg>
