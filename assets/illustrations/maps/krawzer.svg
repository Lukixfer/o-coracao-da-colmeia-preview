    <radialGradient id="map_bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e8e0c8"/>
      <stop offset="100%" stop-color="#c8b88a"/>
    </radialGradient>
    <radialGradient id="stone_grad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ddd0a0"/>
      <stop offset="100%" stop-color="#b8a870"/>
    </radialGradient>
    <radialGradient id="fire_grad" cx="40%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#d06830"/>
      <stop offset="100%" stop-color="#982010"/>
    </radialGradient>
    <linearGradient id="wind_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8dff0"/>
      <stop offset="100%" stop-color="#90b8d8"/>
    </linearGradient>
    <linearGradient id="water_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5090c0"/>
      <stop offset="100%" stop-color="#286898"/>
    </linearGradient>
    <radialGradient id="forest_grad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#5a9a38"/>
      <stop offset="100%" stop-color="#387018"/>
    </radialGradient>
  </defs>

