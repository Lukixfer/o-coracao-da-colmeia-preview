<!-- Tio — Mago da Terra, coloquial e caloroso -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <radialGradient id="bg_tio" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1408"/>
      <stop offset="100%" stop-color="#0d0c05"/>
    </radialGradient>
    <radialGradient id="aura_terra" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#8b5e2a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5a3a10" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle_tio">
      <circle cx="100" cy="105" r="78"/>
    </clipPath>
  </defs>
  <!-- Fundo -->
  <rect width="200" height="260" fill="url(#bg_tio)" rx="8"/>
  <!-- Moldura circular (Terra = marrom/ocre) -->
  <circle cx="100" cy="105" r="80" fill="#111005" stroke="#8b5e2a" stroke-width="2"/>
  <circle cx="100" cy="105" r="78" fill="url(#aura_terra)"/>

  <!-- Torso largo (constituição robusta) -->
  <ellipse cx="100" cy="175" rx="50" ry="30" fill="#0e0b04" clip-path="url(#circle_tio)"/>
  <!-- Pescoço robusto -->
  <rect x="91" y="140" width="18" height="24" rx="4" fill="#b08050"/>
  <!-- Rosto (mais quadrado, robusto) -->
  <path d="M 68,108 Q 70,75 100,72 Q 130,75 132,108 Q 130,135 100,140 Q 70,135 68,108Z"
        fill="#b08050"/>
  <!-- Cabelo (curto, escuro-avermelhado) -->
  <path d="M 68,100 Q 70,72 100,70 Q 130,72 132,100 Q 130,75 100,73 Q 70,75 68,100Z"
        fill="#3a1c08"/>
  <!-- Barba / cavanh (detalhe masculino) -->
  <path d="M 90,133 Q 100,138 110,133 Q 108,142 100,144 Q 92,142 90,133Z"
        fill="#3a1c08" fill-opacity="0.7"/>
  <!-- Olhos (expressivos, calorosos, castanho-escuro) -->
  <ellipse cx="87" cy="104" rx="7" ry="6" fill="#1a0e04"/>
  <ellipse cx="113" cy="104" rx="7" ry="6" fill="#1a0e04"/>
  <circle cx="87" cy="104" r="4" fill="#6b3c1a"/>
  <circle cx="113" cy="104" r="4" fill="#6b3c1a"/>
  <circle cx="88.5" cy="102.5" r="1.5" fill="white" fill-opacity="0.8"/>
  <circle cx="114.5" cy="102.5" r="1.5" fill="white" fill-opacity="0.8"/>
  <!-- Sobrancelhas espessas -->
  <path d="M 80,96 Q 87,93 94,95" stroke="#3a1c08" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 106,95 Q 113,93 120,96" stroke="#3a1c08" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Sorriso (coloquial, caloroso) -->
  <path d="M 90,122 Q 100,130 110,122" stroke="#904030" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Orelhas grandes -->
  <ellipse cx="68" cy="108" rx="6" ry="10" fill="#a87848"/>
  <ellipse cx="132" cy="108" rx="6" ry="10" fill="#a87848"/>
  <!-- Roupas Terra (verde-musgo/marrom) -->
  <path d="M 50,172 Q 65,158 100,154 Q 135,158 150,172 L 155,185 Q 100,192 45,185Z"
        fill="#3d2e10" clip-path="url(#circle_tio)"/>
  <!-- Marcas de terra (elemento visual) -->
  <circle cx="50" cy="85" r="3" fill="#6b4a20" fill-opacity="0.6"/>
  <circle cx="155" cy="90" r="2.5" fill="#8b5e2a" fill-opacity="0.5"/>
  <circle cx="45" cy="115" r="2" fill="#6b4a20" fill-opacity="0.7"/>
  <circle cx="158" cy="120" r="3" fill="#8b5e2a" fill-opacity="0.5"/>
  <!-- Pequenas pedrinhas ao redor -->
  <polygon points="42,140 48,135 52,142 46,147" fill="#5a3a10" fill-opacity="0.6"/>
  <polygon points="150,138 156,133 160,140 154,145" fill="#5a3a10" fill-opacity="0.5"/>

  <!-- Nome -->
  <text x="100" y="207" font-family="Georgia, serif" font-size="18" font-weight="bold"
        fill="#8b5e2a" text-anchor="middle" letter-spacing="2">TIO</text>
  <text x="100" y="225" font-family="Georgia, serif" font-size="10"
        fill="#c8b080" text-anchor="middle" letter-spacing="3" font-style="italic">Mago da Terra</text>
  <line x1="60" y1="232" x2="88" y2="232" stroke="#8b5e2a" stroke-width="0.7" stroke-opacity="0.6"/>
  <polygon points="100,228 104,236 96,236" fill="#8b5e2a" fill-opacity="0.7"/>
  <line x1="112" y1="232" x2="140" y2="232" stroke="#8b5e2a" stroke-width="0.7" stroke-opacity="0.6"/>
  <rect x="3" y="3" width="194" height="254" rx="8" fill="none" stroke="#8b5e2a" stroke-width="0.8" stroke-opacity="0.3"/>
</svg>
